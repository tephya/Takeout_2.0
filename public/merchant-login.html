<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家登录 | 开饭啦</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/merchant-entry.css">
</head>

<body>
    <div class="navbar">
        <div class="nav-left">
            <button class="back-btn" onclick="window.location.href='./merchant-entry.html'">
                <img src="./images/arrow-left.svg" alt="返回">
                <span>返回</span>
            </button>
        </div>
        <div class="nav-center">
            <h1>商家登录</h1>
        </div>
        <div class="nav-right"></div>
    </div>

    <div class="main-container">
        <div class="form-container">

            <!-- 登录表单 -->
            <div id="login-section">
                <div class="form-header">
                    <h2>登录账号</h2>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="login-phone" placeholder="请输入手机号" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password"
                        required>
                </div>
                <div class="submit-section">
                    <button type="button" id="login-submit-btn" class="submit-btn">登录</button>
                </div>
                <div style="text-align:right; margin-top:8px;">
                    <span style="color:#666; font-size:13px; cursor:pointer;" onclick="showResetSection()">忘记密码？</span>
                </div>
                <div style="text-align:center; margin-top:16px; font-size:13px; color:#666;">
                    还没有账号？<span style="cursor:pointer; color:#e4393c;"
                        onclick="window.location.href='merchant-register.html'">立即入驻</span>
                </div>
            </div>

            <!-- 忘记密码 -->
            <div id="reset-section" style="display:none;">
                <div class="form-header">
                    <h2>重置密码</h2>
                </div>
                <div class="form-group">
                    <label>注册手机号</label>
                    <input type="tel" id="reset-phone" placeholder="请输入注册时的手机号" required>
                </div>
                <div class="form-group">
                    <button type="button" class="login-btn" id="get-reset-code-btn">获取验证码</button>
                    <div id="reset-code-area" style="margin-top:10px;"></div>
                </div>
                <div class="form-group" id="reset-password-area" style="display:none;">
                    <label>新密码</label>
                    <input type="password" id="reset-new-password" maxlength="20" placeholder="请输入新密码"
                        autocomplete="new-password">
                </div>
                <div class="submit-section" id="reset-submit-section" style="display:none;">
                    <button type="button" onclick="showLoginSection()">取消</button>
                    <button type="button" id="reset-submit-btn">确认重置</button>
                </div>
                <div style="text-align:right; margin-top:8px;">
                    <span style="color:#666; font-size:13px; cursor:pointer;" onclick="showLoginSection()">返回登录</span>
                </div>
            </div>

        </div>
    </div>

    <script src="./js/common-utils.js"></script>
    <script src="./js/merchant-login.js"></script>
</body>

</html>
