<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/myorder.css">
</head>

<body>

    <!-- ── 顶栏（与首页共用同一结构） ── -->
    <header class="home-topbar">
        <a href="./index.html" class="topbar-brand">
            <img src="./images/logo/a_home_header_logo.svg" class="topbar-logo-left" alt="">
            <img src="./images/logo/logo.png" class="topbar-logo-right" alt="">
        </a>
        <span class="topbar-page-title">我的订单</span>

        <div class="topbar-right">
            <button id="refresh-btn" class="topbar-refresh-btn" title="刷新订单">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                刷新
            </button>
            <span id="unlogin" class="topbar-login-text" onclick="showLoginPopup()">登录</span>
            <img id="is-login" class="topbar-avatar" src="" alt="">
        </div>
    </header>

    <!-- ── 主内容 ── -->
    <main class="mo-main">
        <div class="breadcrumb">
            <a href="./index.html" class="breadcrumb-home">
                <img src="./images/icons/home.svg" class="breadcrumb-icon">
                首页
            </a>
            <span class="breadcrumb-sep"> › </span>
            <span class="breadcrumb-current">我的订单</span>
        </div>
        <div class="mo-wrap">
            <div class="mo-section-head">
                <span class="mo-section-title">全部订单</span>
            </div>
            <div id="order-content" class="order-content">
                <div class="loading">加载中…</div>
            </div>
        </div>
    </main>

    <script src="./js/common-utils.js"></script>
    <script src="./js/load-login-modal.js"></script>
    <script src="./js/user-state.js"></script>
    <script src="./js/myorder.js"></script>
</body>

</html>
