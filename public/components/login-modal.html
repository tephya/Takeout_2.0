<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/pages/auth-popup.css">

</head>
<body> 
    <!-- ── 登录弹窗 ── -->
    <div class="login-overlay" id="login-overlay" style="display:none"></div>
    <div class="login-popup" id="login-popup" style="display:none">
        <div class="login-popup-content">
            <img src="./images/buttons/close.png" class="login-close-btn" onclick="closeLoginPopup()">
            <div class="login-header">
                <h2>用户登录</h2>
            </div>
            <div class="login-mode-switch">
                <span class="login-mode-option active" id="password-mode-btn" onclick="switchToPasswordMode()">密码登录</span>
                <span class="login-mode-option" id="captcha-mode-btn" onclick="switchToCaptchaMode()">验证码登录</span>
            </div>
            <div class="password-login-area" id="password-login-area">
                <div class="input-group">
                    <label>账户ID/手机号</label>
                    <input type="text" id="account-input" placeholder="请输入账户ID或手机号">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="password-input" placeholder="请输入密码">
                </div>
                <div class="error-message" id="password-error"></div>
                <div style="text-align:right; margin: -4px 0 12px;">
                    <span id="forgot-password-link" style="color:#e74c3c; font-size:13px; cursor:pointer;">忘记密码？</span>
                </div>
                <button class="login-submit-btn" id="password-login-btn">登录</button>
            </div>
            <div class="captcha-login-area" id="captcha-login-area" style="display: none;">
                <div class="input-group">
                    <label>手机号</label>
                    <div class="phone-input-container">
                        <span class="country-code">+86</span>
                        <input type="text" id="phone-input" placeholder="请输入手机号" maxlength="13">
                    </div>
                </div>
                <button class="get-code-btn" id="get-code-btn">获取验证码</button>
                <div class="verification-code-area" id="verification-code-area"></div>
            </div>
            <div class="register-link">
                <span>还没有账户？</span>
                <span class="register-btn" onclick="showRegisterPopup()">立即注册</span>
            </div>
        </div>
    </div>
    
    <!-- ── 注册弹窗 ── -->
    <div class="register-popup" id="register-popup" style="display: none;">
        <div class="register-popup-content">
            <img src="./images/buttons/close.png" class="register-close-btn" onclick="closeRegisterPopup()">
            <div class="register-header">
                <h2>用户注册</h2>
            </div>
            <form id="register-form">
                <div class="input-group">
                    <label>用户ID</label>
                    <input type="text" id="user-id" readonly>
                </div>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="register-password" required
                        pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,16}$" placeholder="6-16位，包含字母和数字">
                </div>
                <div class="input-group">
                    <label>确认密码</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <div class="input-group">
                    <label>手机号</label>
                    <div class="phone-input-container">
                        <span class="country-code">+86</span>
                        <input type="text" id="register-phone" placeholder="请输入手机号" maxlength="13" required>
                        <button type="button" class="get-code-btn" id="register-get-code-btn"
                            onclick="sendRegisterCode()">获取验证码</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>验证码</label>
                    <input type="text" id="register-verification-code" placeholder="请输入6位验证码" maxlength="6" required>
                </div>
                <button type="submit" class="register-submit-btn">注册</button>
            </form>
        </div>
    </div>

    <!-- ── 忘记密码弹窗 ── -->
    <div id="forgot-password-modal"
        style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; z-index:2000;">
        <div style="position:absolute; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.4);"
            id="forgot-mask"></div>
        <div
            style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; border-radius:12px; padding:32px; min-width:320px; max-width:90vw; box-shadow:0 4px 24px rgba(0,0,0,0.15);">
            <div style="font-size:18px; font-weight:600; margin-bottom:20px;">重置密码</div>
            <div class="input-group">
                <label>手机号</label>
                <div class="phone-input-container">
                    <span class="country-code">+86</span>
                    <input type="text" id="forgot-phone" placeholder="请输入注册手机号" maxlength="11">
                    <button type="button" class="get-code-btn" id="forgot-get-code-btn">获取验证码</button>
                </div>
            </div>
            <div class="input-group">
                <label>验证码</label>
                <input type="text" id="forgot-code" placeholder="请输入6位验证码" maxlength="6">
            </div>
            <div class="input-group">
                <label>新密码</label>
                <input type="password" id="forgot-new-password" placeholder="6-16位，包含字母和数字">
            </div>
            <div id="forgot-error" style="color:#e74c3c; font-size:13px; margin-bottom:12px; display:none;"></div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
                <button id="forgot-cancel-btn"
                    style="background:#eee; color:#333; padding:8px 24px; border:none; border-radius:6px; cursor:pointer;">取消</button>
                <button id="forgot-submit-btn"
                    style="background:#e74c3c; color:#fff; padding:8px 24px; border:none; border-radius:6px; cursor:pointer;">确认重置</button>
            </div>
        </div>
    </div>
    
</body>
</html>
