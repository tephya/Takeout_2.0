<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家审核 | 管理后台</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/admin.css">
    <style>
        .filter-tab {
            min-width: 90px;
        }
    </style>
</head>

<body class="admin-dashboard-page">

    <!-- 顶栏 -->
    <header class="admin-header">
        <div class="admin-header-left">
            <span class="admin-header-logo">🍱</span>
            <span class="admin-header-title">开饭啦管理后台</span>
        </div>
        <button id="logout-btn" class="admin-logout-btn">退出登录</button>
    </header>

    <!-- 主体 -->
    <main class="admin-main">
        <h2 class="page-title">商家入驻审核</h2>

        <!-- 状态筛选 -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-status="">全部</button>
            <button class="filter-tab" data-status="pending">
                待审核 <span id="badge-pending" class="badge"></span>
            </button>
            <button class="filter-tab" data-status="approved">已通过</button>
            <button class="filter-tab" data-status="rejected">已拒绝</button>
        </div>

        <!-- 申请列表 -->
        <div id="application-list" class="application-list">
            <div class="loading-tip">加载中…</div>
        </div>
    </main>

    <!-- 拒绝原因弹窗 -->
    <div id="reject-modal" class="modal-overlay" style="display:none">
        <div class="modal-card">
            <h3>填写拒绝原因</h3>
            <textarea id="reject-reason-input" placeholder="请说明拒绝原因，商家可见" rows="4"></textarea>
            <div id="reject-error" class="modal-error" style="display:none"></div>
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="modal-btn modal-btn-cancel">取消</button>
                <button id="modal-confirm-btn" class="modal-btn modal-btn-confirm">确认拒绝</button>
            </div>
        </div>
    </div>

    <script src="./js/admin-dashboard.js"></script>
</body>

</html>
