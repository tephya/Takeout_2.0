<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家详情 | 开饭啦</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/home.css">
    <link rel="stylesheet" href="./css/pages/auth-popup.css">
    <link rel="stylesheet" href="./css/pages/order-popup.css">
    <link rel="stylesheet" href="./css/pages/cart.css">
    <link rel="stylesheet" href="./css/pages/merchant-page.css">
    <base target="_self">
</head>

<body>

    <!-- ── 顶栏 ── -->
    <header class="home-topbar">
        <a href="./index.html" class="topbar-brand">
            <img src="./images/logo/a_home_header_logo.svg" class="topbar-logo-left" alt="开饭啦">
            <img src="./images/logo/logo.png" class="topbar-logo-right" alt="">
        </a>
        <div class="topbar-search">
            <img src="./images/system/system.png" class="topbar-search-icon" alt="">
            <input type="text" class="topbar-search-input" placeholder="搜索餐厅或菜品...">
        </div>
        <div class="topbar-right">
            <div class="topbar-lang">
                <img src="./images/system/system.png" alt="" class="topbar-lang-icon">
                <span>中国|简</span>
            </div>
            <span id="unlogin" class="topbar-login-btn" onclick="showLoginPopup()">登录</span>
            <img src="./images/icons/user-avator.webp" class="topbar-avatar" id="is-login"
                onclick="window.location.href='account.html'" style="cursor:pointer;">
            <input type="file" id="avatar-upload-input" accept="image/jpeg,image/png,image/webp" style="display:none;">
        </div>
    </header>

    <!-- 商家 hero 区 -->
    <div class="merchant-hero">
        <div class="merchant-hero-cover" id="merchant-hero-cover"></div>
        <div class="merchant-hero-info">
            <a href="./index.html" class="merchant-back">← 返回首页</a>
            <h1 class="merchant-hero-name" id="merchant-hero-name">加载中…</h1>
            <div class="merchant-hero-meta">
                <span id="merchant-hero-address"></span>
                <span id="merchant-hero-hours"></span>
                <span class="merchant-hero-status" id="merchant-hero-status"></span>
            </div>
        </div>
    </div>

    <!-- 菜品区 -->
    <div class="merchant-products-wrap">
        <div class="merchant-menu-layout">
            <aside class="merchant-cat-sidebar" id="merchant-cat-sidebar"></aside>
            <div class="merchant-product-main">
                <div id="product-loading" class="merchant-state">加载菜单中…</div>
                <div id="product-empty" class="merchant-state" style="display:none">暂无菜品</div>
                <div id="product-grid"></div>
            </div>
        </div>
    </div>

    <!-- 结账弹窗 -->
    <div class="order-overlay" id="order-overlay"></div>
    <div id="popup-pay-interface" class="popup-pay-interface">
        <div class="popup-pay-interface-content">
            <img src="./images/buttons/close.png" onclick="closePayPopup()">
            <div class="content-header"><span>下单</span></div>
            <div class="content-delivery-time">
                <img src="./images/icons/emoji-menu.svg">
                <div class="delivery-time-content">
                    <div class="output-time" id="output-time"></div>
                    <span class="expected-time">预计送达时间</span>
                </div>
            </div>
            <div id="orders-container"></div>
            <div id="order-details-container"></div>
            <div class="cutlery-section">
                <div class="cutlery-content">
                    <div class="cutlery-info">
                        <div class="cutlery-title-row"><span class="cutlery-title">需要餐具</span></div>
                        <div class="cutlery-subtitle-row">
                            <img src="./images/icons/Enviroment.svg" alt="环保图标" class="eco-icon">
                            <span class="cutlery-subtitle">减碳节源，绿色经营</span>
                        </div>
                    </div>
                    <div class="toggle-switch">
                        <input type="checkbox" id="cutlery-toggle" checked>
                        <label for="cutlery-toggle" class="toggle-label"></label>
                    </div>
                </div>
            </div>
            <div class="customer-info-section">
                <div class="input-field">
                    <label for="customer-name">用户名 <span class="required">*</span></label>
                    <input type="text" id="customer-name" readonly>
                </div>
                <div class="phone-field">
                    <label for="customer-phone">电话号码 <span class="required">*</span></label>
                    <div class="phone-input-group">
                        <span class="country-code">+86</span>
                        <input type="tel" id="customer-phone">
                    </div>
                    <div class="error-message" id="phone-error">
                        <span class="error-icon">⚠</span><span>请提供电话号码</span>
                    </div>
                </div>
            </div>
            <div class="address-field">
                <label for="customer-address">配送地址 <span class="required">*</span></label>
                <div class="address-input-group">
                    <input type="text" id="customer-address" placeholder="请输入配送地址">
                    <button type="button" id="edit-address-btn" style="display:none">修改</button>
                </div>
                <div class="error-message" id="address-error">
                    <span class="error-icon">⚠</span><span>请提供配送地址</span>
                </div>
            </div>
            <div class="payment-section">
                <button class="payment-btn" id="payment-btn">付款 <span class="payment-amount">￥0</span></button>
                <div class="payment-note">点击付款即表示您同意我们的服务条款与隐私政策</div>
            </div>
        </div>
    </div>

    <!-- 购物车 FAB -->
    <div id="cart-fab" onclick="Cart.toggleDrawer()">
        <span style="font-size:24px;line-height:1">🛒</span>
        <span id="cart-fab-badge">0</span>
    </div>

    <!-- 购物车抽屉 -->
    <div id="cart-drawer-overlay" onclick="Cart.toggleDrawer()"></div>
    <div id="cart-drawer">
        <div class="cart-drawer-header">
            <span class="cart-drawer-title">购物车</span>
            <button class="cart-drawer-close" onclick="Cart.toggleDrawer()">✕</button>
        </div>
        <div id="cart-drawer-body"></div>
    </div>

    <!-- ── 登录弹窗 ── -->
    <div class="login-overlay" id="login-overlay"></div>
    <div class="login-popup" id="login-popup">
        <div class="login-popup-content">
            <img src="./images/buttons/close.png" class="login-close-btn" onclick="closeLoginPopup()">
            <div class="login-header">
                <h2>用户登录</h2>
            </div>
            <div class="login-mode-switch">
                <span class="login-mode-option active" id="password-mode-btn"
                    onclick="switchToPasswordMode()">密码登录</span>
                <span class="login-mode-option" id="captcha-mode-btn" onclick="switchToCaptchaMode()">验证码登录</span>
            </div>
            <div class="password-login-area" id="password-login-area">
                <div class="input-group">
                    <label>账户ID/手机号</label>
                    <input type="text" id="account-input" placeholder="请输入账户ID或手机号">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="password-input" placeholder="请输入密码">
                </div>
                <div class="error-message" id="password-error"></div>
                <button class="login-submit-btn" id="password-login-btn">登录</button>
            </div>
            <div class="captcha-login-area" id="captcha-login-area" style="display: none;">
                <div class="input-group">
                    <label>手机号</label>
                    <div class="phone-input-container">
                        <span class="country-code">+86</span>
                        <input type="text" id="phone-input" placeholder="请输入手机号" maxlength="13">
                    </div>
                </div>
                <button class="get-code-btn" id="get-code-btn">获取验证码</button>
                <div class="verification-code-area" id="verification-code-area"></div>
            </div>
            <div class="register-link">
                <span>还没有账户？</span>
                <span class="register-btn" onclick="showRegisterPopup()">立即注册</span>
            </div>
        </div>
    </div>

    <!-- ── 注册弹窗 ── -->
    <div class="register-popup" id="register-popup" style="display: none;">
        <div class="register-popup-content">
            <img src="./images/buttons/close.png" class="register-close-btn" onclick="closeRegisterPopup()">
            <div class="register-header">
                <h2>用户注册</h2>
            </div>
            <form id="register-form">
                <div class="input-group">
                    <label>用户ID</label>
                    <input type="text" id="user-id" readonly>
                </div>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="register-password" required
                        pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,16}$" placeholder="6-16位，包含字母和数字">
                </div>
                <div class="input-group">
                    <label>确认密码</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <div class="input-group">
                    <label>手机号</label>
                    <div class="phone-input-container">
                        <span class="country-code">+86</span>
                        <input type="text" id="register-phone" placeholder="请输入手机号" maxlength="13" required>
                        <button type="button" class="get-code-btn" id="register-get-code-btn"
                            onclick="sendRegisterCode()">获取验证码</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>验证码</label>
                    <input type="text" id="register-verification-code" placeholder="请输入6位验证码" maxlength="6" required>
                </div>
                <button type="submit" class="register-submit-btn">注册</button>
            </form>
        </div>
    </div>

    <script src="./js/order-popup.js"></script>
    <script src="./js/common-utils.js"></script>
    <script src="./js/output-time.js"></script>
    <script src="./js/user-state.js"></script>
    <script src="./js/load-login-modal.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/merchant-page.js"></script>

</body>

</html>
