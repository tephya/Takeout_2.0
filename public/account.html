<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户设置 | 开饭啦</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/account.css">

</head>

<body class="page-account">

    <!-- a1 顶栏 -->
    <div class="a1">
        <div class="a1-d1 a1-span">
            <img src="./images/system/system.png" alt="">
            <span>中国|简</span>
        </div>
        <div class="a1-d2">
            <img src="./images/icons/user-avator.webp" class="user-avator" id="a1-avatar" style="cursor:default;">
        </div>
    </div>

    <!-- a2 品牌栏 -->
    <div class="a2">
        <a href="./index.html" style="display:flex; align-items:center;">
            <img src="./images/logo/a_home_header_logo.svg" class="logo-left">
            <img src="./images/logo/logo.png" class="logo-right">
        </a>
        <div class="myorder">
            <a href="./myorder.html">
                <button>我的订单</button>
            </a>
        </div>
    </div>


    <div class="breadcrumb" id="account-breadcrumb">
        <a href="./index.html" class="breadcrumb-home">
            <img src="./images/icons/home.svg" class="breadcrumb-icon">
            首页
        </a>
        <span class="breadcrumb-sep"> › </span>
        <span class="breadcrumb-current">账户设置</span>
    </div>

    <!-- 主体布局 -->
    <div class="account-layout">

        <!-- 左侧导航 -->
        <div class="account-sidebar">
            <div class="sidebar-avatar-area">
                <div class="sidebar-avatar" id="sidebar-avatar" onclick="triggerAvatarUpload()">
                    <img src="./images/icons/user-avator.webp" id="account-avatar-img" alt="头像">
                    <div class="avatar-upload-overlay">更换</div>
                </div>
                <input type="file" id="account-avatar-input" accept="image/jpeg,image/png,image/webp"
                    style="display:none;">
                <div class="sidebar-username" id="sidebar-username">加载中...</div>
                <div class="sidebar-userid" id="sidebar-userid"></div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item active" data-section="profile" onclick="switchSection('profile')">
                    <img src="./images/icons/user.svg" alt="" class="nav-icon">
                    个人资料
                </div>
                <div class="nav-item" data-section="security" onclick="switchSection('security')">
                    <img src="./images/icons/setting.svg" alt="" class="nav-icon">
                    账号安全
                </div>
                <div class="nav-item" data-section="address" onclick="switchSection('address')">
                    <img src="./images/icons/location.svg" alt="" class="nav-icon">
                    收货地址
                </div>
                <div class="nav-item nav-logout" onclick="accountLogout()">
                    登出
                </div>
            </nav>
        </div>

        <!-- 右侧内容 -->
        <div class="account-content">

            <!-- 个人资料 -->
            <div class="section" id="section-profile">
                <div class="section-header">
                    <h2>个人资料</h2>
                    <p>管理您的用户名信息</p>
                </div>
                <div class="field-group">
                    <label>用户 ID</label>
                    <div class="field-row">
                        <input type="text" id="profile-userid" readonly>
                    </div>
                </div>
                <div class="field-group">
                    <label>用户名</label>
                    <div class="field-row">
                        <input type="text" id="profile-username" placeholder="请输入新用户名" maxlength="20">
                        <button class="save-btn" onclick="saveUsername()">保存</button>
                    </div>
                    <span class="field-error" id="username-error"></span>
                </div>
            </div>

            <!-- 账号安全 -->
            <div class="section" id="section-security" style="display:none;">
                <div class="section-header">
                    <h2>账号安全</h2>
                    <p>管理您的手机号与登录密码</p>
                </div>

                <!-- 手机号 -->
                <div class="security-block">
                    <div class="security-block-title">手机号</div>
                    <div class="field-group">
                        <label>当前手机号</label>
                        <div class="field-row">
                            <input type="text" id="security-phone-display" readonly>
                            <button class="edit-btn" onclick="togglePhoneEdit()">修改</button>
                        </div>
                    </div>
                    <div id="phone-edit-area" style="display:none;">
                        <div class="field-group">
                            <label>验证当前手机号</label>
                            <button class="code-btn" id="get-current-phone-code-btn"
                                onclick="sendCurrentPhoneCode()">获取验证码</button>
                            <div id="current-phone-code-area"></div>
                        </div>
                        <div id="new-phone-area" style="display:none;">
                            <div class="field-group">
                                <label>新手机号</label>
                                <div class="field-row">
                                    <span class="country-code">+86</span>
                                    <input type="text" id="new-phone-input" placeholder="请输入新手机号" maxlength="11">
                                </div>
                            </div>
                            <button class="code-btn" id="get-new-phone-code-btn"
                                onclick="sendNewPhoneCode()">获取验证码</button>
                            <div id="new-phone-code-area"></div>
                            <button class="save-btn" id="confirm-phone-btn" style="display:none;"
                                onclick="savePhone()">确认修改</button>
                            <span class="field-error" id="phone-error"></span>
                        </div>
                    </div>
                </div>

                <!-- 修改密码 -->
                <div class="security-block">
                    <div class="security-block-title">登录密码</div>
                    <div class="field-group">
                        <label>验证手机号</label>
                        <button class="code-btn" id="get-verify-code-btn" onclick="sendVerifyCode()">获取验证码</button>
                        <div id="verify-code-area"></div>
                    </div>
                    <div id="password-edit-area" style="display:none;">
                        <div class="field-group">
                            <label>新密码</label>
                            <input type="password" id="new-password" placeholder="6-16位，包含字母和数字">
                        </div>
                        <div class="field-group">
                            <label>确认新密码</label>
                            <input type="password" id="confirm-new-password" placeholder="请再次输入新密码">
                        </div>
                        <span class="field-error" id="password-error"></span>
                        <button class="save-btn" onclick="savePassword()">确认修改</button>
                    </div>
                </div>
            </div>

            <!-- 收货地址 -->
            <div class="section" id="section-address" style="display:none;">
                <div class="section-header">
                    <h2>收货地址</h2>
                    <p>管理您的收货地址，默认地址将用于下单</p>
                </div>
            
                <!-- 地址列表 -->
                <div id="address-list"></div>
            
                <!-- 新增地址 -->
                <div class="field-group" style="margin-top:20px;">
                    <label>新增地址</label>
                    <div class="field-row">
                        <input type="text" id="new-address-label" placeholder="标签（选填，如：家、公司）" maxlength="20"
                            style="width:120px; margin-right:8px;">
                        <input type="text" id="new-address-input" placeholder="请输入详细地址" maxlength="200">
                        <button class="save-btn" onclick="addAddress()">添加</button>
                    </div>
                    <span class="field-error" id="address-error"></span>
                </div>
            </div>

        </div>
    </div>


    <script src="./js/common-utils.js"></script>
    <script src="./js/account.js"></script>
</body>

</html>
